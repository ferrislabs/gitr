name: Release

# Pushing an `x.y.z` tag builds the binary and publishes a GitHub release from it.
# `workflow_dispatch` runs everything except the publishing step, so the expensive and
# failure-prone half — the build, the packaging, the checksum — can be exercised end to
# end without creating a release anyone can see.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: Read the crate version
        id: version
        run: |
          set -euo pipefail
          pkgid="$(cargo pkgid -p gitr_gui)"
          version="${pkgid##*@}"
          if [ "${version}" = "${pkgid}" ]; then
            echo "::error::cargo pkgid reported no version: ${pkgid}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "gitr_gui is ${version}"

      # A tag is a promise about which version the binary is, and nothing else checks it:
      # the tag and `version` in Cargo.toml are written in different places at different
      # times, so a mismatch would publish a binary labelled as a release it is not.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match gitr_gui ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Build
        run: cargo build --release -p gitr_gui

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="gitr-${{ steps.version.outputs.version }}-aarch64-apple-darwin"
          tar -czf "${name}.tar.gz" -C target/release gitr
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          shasum -a 256 -c "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Uploaded on every run, tag or not. On a dispatch this is the whole point: the
      # artifact is what proves the build and the packaging worked, with nothing published.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      # Written to a file rather than passed inline: `--notes-file` and `--generate-notes`
      # are not documented as combining, and a release that fails to publish after a
      # twenty-minute build is a bad way to find out.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Apple Silicon only. The binary is unsigned, so macOS quarantines it on download —
          clear the flag before the first run:

          ```sh
          tar -xzf gitr-*-aarch64-apple-darwin.tar.gz
          xattr -d com.apple.quarantine gitr
          ./gitr
          ```

          Building it yourself avoids that entirely, since nothing is downloaded:

          ```sh
          cargo install --locked --git https://github.com/ferrislabs/gitr
          ```

          Run `gitr` inside a checkout to open it. The command returns the prompt straight
          away and brings the window to the front.
          NOTES
          previous="$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          if [ -n "$previous" ]; then
            printf '\n**Full changelog**: %s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$previous" "${GITHUB_REF_NAME}" >> release-notes.md
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}.tar.gz.sha256"
