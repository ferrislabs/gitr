[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/graph",
    "crates/vcs",
    "crates/ui",
    "crates/gitr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/ferrislabs/gitr"

[workspace.dependencies]
domain = { package = "gitr-domain", path = "crates/domain", version = "0.1.0" }
graph = { package = "gitr-graph", path = "crates/graph", version = "0.1.0" }
vcs = { package = "gitr-vcs", path = "crates/vcs", version = "0.1.0" }
ui = { package = "gitr-ui", path = "crates/ui", version = "0.1.0" }

gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter", "tree-sitter-diff", "tree-sitter-rust"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui-base = { git = "https://github.com/longbridge/gpui-component" }

gix = "0.86"
notify = "8.2"
notify-debouncer-full = "0.7"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false
